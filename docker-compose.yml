services:
  db:
    image: mongo:7.0
    container_name: skud_db
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: skud_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: skud_frontend
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: